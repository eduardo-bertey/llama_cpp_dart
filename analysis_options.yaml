include: package:lints/recommended.yaml

analyzer:
  exclude:
    - 'lib/src/ffi/bindings.dart'
    - 'src/**'
    - 'build/**'
    # Flutter app with its own dependency graph; analyzed by `flutter analyze`
    # inside app-openmoe (see .github/workflows/build-windows.yml).
    - 'app-openmoe/**'

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
