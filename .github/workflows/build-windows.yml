name: build-windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: analyze + tests + Windows app bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: dart pub get
        run: dart pub get

      - name: ensure libclang available (needed by ffigen)
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            choco install llvm -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\Program Files\LLVM\bin'
          }
          Write-Host "llama.cpp vendored at: $(git -C src\llama.cpp describe --tags --always)"

      # Regenerate bindings from the vendored llama.cpp headers (b12050) so
      # the FFI structs match the shipped release DLLs exactly — the old
      # committed bindings were generated from b10182 and lacked fields
      # (e.g. llama_model_params.lazy_mode) → 4-byte struct mismatch →
      # access violation inside llama.dll at llama_model_load_from_file.
      - name: regenerate bindings (ffigen) from vendored headers
        run: |
          dart run ffigen
          dart format lib\src\ffi\bindings.dart

      - name: dart analyze
        run: dart analyze

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib tool/probe_windows_dlls.dart tool/smoke_windows_model.dart

      - name: pure-dart tests
        run: |
          dart test test/utf8_accumulator_test.dart
          dart test test/mobile_chat_api_test.dart
          dart test test/android_native_assets_test.dart

      - name: download llama.cpp Windows DLLs (b12050, cpu-x64)
        run: |
          New-Item -ItemType Directory -Force build\win-libs | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b12050/llama-b12050-bin-win-cpu-x64.zip' `
            -OutFile build\llama-b12050-bin-win-cpu-x64.zip
          Expand-Archive `
            -Path build\llama-b12050-bin-win-cpu-x64.zip `
            -DestinationPath build\win-libs -Force

      - name: symbol coverage vs generated bindings
        run: python tool/windows_symbol_check.py build\win-libs

      - name: loader probe against the real DLLs
        run: dart run tool/probe_windows_dlls.dart build\win-libs

      - name: download smoke model (Qwen3.5-0.8B Q4_0, ~563 MB)
        run: |
          New-Item -ItemType Directory -Force build\smoke-model | Out-Null
          Invoke-WebRequest `
            -Uri 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf' `
            -OutFile build\smoke-model\Qwen3.5-0.8B-Q4_0.gguf

      - name: ABI smoke — load real model with the real DLLs
        run: dart run tool/smoke_windows_model.dart build\win-libs build\smoke-model\Qwen3.5-0.8B-Q4_0.gguf

      - name: flutter pub get (app-openmoe)
        working-directory: app-openmoe
        run: flutter pub get

      - name: flutter analyze (app-openmoe)
        working-directory: app-openmoe
        run: flutter analyze

      - name: flutter test (app-openmoe)
        working-directory: app-openmoe
        run: flutter test

      - name: flutter build windows --release
        working-directory: app-openmoe
        run: flutter build windows --release

      - name: bundle llama.cpp DLLs beside the app exe
        run: |
          $out = 'app-openmoe\build\windows\x64\runner\Release'
          Copy-Item build\win-libs\*.dll $out -Force
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

      - name: package portable zip
        run: |
          Compress-Archive `
            -Path 'app-openmoe\build\windows\x64\runner\Release\*' `
            -DestinationPath openmoe-windows-portable.zip -Force
          Get-Item openmoe-windows-portable.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: openmoe-windows-portable
          path: openmoe-windows-portable.zip
          if-no-files-found: error
